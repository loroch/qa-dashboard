version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qa-dashboard-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # NextGen QA Hub reads the K1-NG monorepo from this mount. Point NEXTGEN_REPO_HOST_PATH (.env)
      # at a local clone; when it is unset the folder starts empty and the hub clones into it with
      # NEXTGEN_GITLAB_TOKEN.
      NEXTGEN_REPO_PATH: /app/nextgen-repo
    volumes:
      - ./config:/app/config:ro          # field_mapping.yaml
      - ${NEXTGEN_REPO_HOST_PATH:-./nextgen-repo}:/app/nextgen-repo
      - qa_data:/app/data                # SQLite database
      - qa_automation_runs:/tmp/qa-dashboard-automation-runs   # automation scripts + screenshots — must survive container recreation
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - qa-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qa-dashboard-ui
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - qa-net

volumes:
  qa_data:
  qa_automation_runs:

networks:
  qa-net:
    driver: bridge
