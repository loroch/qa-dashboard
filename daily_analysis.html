<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Alert Analysis</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:   #080c18;
  --bg2:  #0f1525;
  --card: rgba(255,255,255,0.045);
  --bdr:  rgba(255,255,255,0.08);
  --t1:   #e2e8f0;
  --t2:   #94a3b8;
  --t3:   #475569;
  --ora:  #ea580c;
  --grn:  #22c55e;
  --red:  #ef4444;
  --amb:  #f59e0b;
  --ai:   #6366f1;
}
body {
  background: var(--bg);
  color: var(--t1);
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 13px;
  min-height: 100vh;
}

/* ── Header ── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 28px;
  background: var(--bg2);
  border-bottom: 1px solid var(--bdr);
  position: sticky; top: 0; z-index: 10;
}
.logo-wrap { display:flex; align-items:center; gap:12px; }
.logo-icon {
  width:36px; height:36px; border-radius:10px;
  background: linear-gradient(135deg,#ea580c,#7c2d12);
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:800; color:#fff;
}
.logo-text h1 { font-size:16px; font-weight:700; }
.logo-text p  { font-size:11px; color:var(--t3); }
.header-right { display:flex; align-items:center; gap:12px; }
.back-btn {
  padding:6px 14px; border-radius:8px;
  background:var(--card); border:1px solid var(--bdr);
  color:var(--t2); font-size:12px; cursor:pointer;
  text-decoration:none;
}
.run-btn {
  padding:7px 18px; border-radius:8px;
  background: linear-gradient(135deg,#6366f1,#4338ca);
  border:none; color:#fff; font-size:12px;
  font-weight:600; cursor:pointer;
}
.run-btn:disabled { opacity:0.5; cursor:default; }
.ts { font-size:11px; color:var(--t3); }

/* ── Main layout ── */
.main {
  max-width: 1320px;
  margin: 0 auto;
  padding: 28px 24px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}
@media (max-width: 900px) { .main { grid-template-columns: 1fr; } }

/* ── Cards ── */
.panel {
  background: var(--card);
  border: 1px solid var(--bdr);
  border-radius: 14px;
  padding: 20px;
}
.panel.full { grid-column: 1 / -1; }
.panel-title {
  font-size: 11px; font-weight: 600;
  letter-spacing: 1px; text-transform: uppercase;
  color: var(--t3); margin-bottom: 16px;
}

/* ── KPI row ── */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}
.kpi {
  background: var(--card);
  border: 1px solid var(--bdr);
  border-radius: 12px;
  padding: 16px 18px;
}
.kpi-label { font-size: 11px; color: var(--t3); margin-bottom: 6px; }
.kpi-value { font-size: 26px; font-weight: 700; }
.kpi-delta { font-size: 11px; margin-top: 4px; color: var(--t3); }
.delta-up   { color: var(--red); }
.delta-down { color: var(--grn); }
.delta-same { color: var(--t3); }

/* ── Table ── */
table { width: 100%; border-collapse: collapse; }
thead th {
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.8px; text-transform: uppercase;
  color: var(--t3); padding: 6px 10px;
  border-bottom: 1px solid var(--bdr); text-align: left;
}
tbody td {
  padding: 8px 10px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  color: var(--t1);
}
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: rgba(255,255,255,0.025); }
.sev-badge {
  display: inline-block;
  padding: 2px 8px; border-radius: 5px;
  font-size: 10px; font-weight: 600;
}
.sev-5 { background:rgba(239,68,68,.2);  color:#f87171; }
.sev-4 { background:rgba(249,115,22,.2); color:#fb923c; }
.sev-3 { background:rgba(245,158,11,.2); color:#fbbf24; }
.sev-2 { background:rgba(234,179,8,.15); color:#facc15; }
.sev-1 { background:rgba(148,163,184,.1);color:#94a3b8; }
.sev-0 { background:rgba(71,85,105,.2);  color:#64748b; }

.trend { font-size: 11px; }
.trend-up   { color: var(--red); }
.trend-down { color: var(--grn); }
.trend-same { color: var(--t3); }

/* ── Issue list ── */
.issue-list { list-style: none; }
.issue-list li {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
}
.issue-list li:last-child { border-bottom: none; }
.issue-rank {
  width: 20px; min-width: 20px;
  font-size: 10px; color: var(--t3); font-weight: 600;
}
.issue-name { flex: 1; color: var(--t1); font-size: 12px; line-height: 1.4; }
.issue-count {
  font-size: 12px; font-weight: 700;
  background: rgba(234,88,12,0.15);
  color: var(--ora); padding: 2px 8px; border-radius: 5px;
  min-width: 36px; text-align: center;
}

/* ── AI Report ── */
.ai-panel { border-color: rgba(99,102,241,0.3); }
.ai-title {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 16px;
}
.ai-badge {
  background: linear-gradient(135deg,#6366f1,#312e81);
  color: #fff; font-size: 10px; font-weight: 700;
  padding: 2px 8px; border-radius: 5px;
  letter-spacing: 0.5px;
}
.ai-report {
  font-size: 13px; line-height: 1.75;
  color: var(--t1); white-space: pre-wrap;
}
.ai-placeholder {
  font-size: 12px; color: var(--t3);
  font-style: italic; line-height: 1.7;
}

/* ── States ── */
.loading-msg { color: var(--t3); font-size: 13px; text-align: center; padding: 40px 0; }
.err-box {
  background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25);
  border-radius: 10px; padding: 16px 20px; color: #fca5a5; font-size: 12px;
}
</style>
</head>
<body>

<div class="header">
  <div class="logo-wrap">
    <div class="logo-icon">K1</div>
    <div class="logo-text">
      <h1 id="page-title">Daily Alert Analysis</h1>
      <p id="page-sub">Loading...</p>
    </div>
  </div>
  <div class="header-right">
    <span class="ts" id="gen-ts"></span>
    <a class="back-btn" href="/">&#8592; Hub</a>
    <button class="run-btn" id="run-btn" onclick="runAnalysis()">Run Analysis</button>
  </div>
</div>

<div id="root" style="max-width:1320px;margin:0 auto;padding:28px 24px">
  <p class="loading-msg">Click "Run Analysis" to fetch the last 24h Zabbix alert data.</p>
</div>

<script>
const _site = new URLSearchParams(location.search).get('site') || 'tamaulipas';
const SEV_ORDER = ['Disaster','High','Average','Warning','Info','Not classified'];
const SEV_CLASS = {
  'Disaster':'sev-5','High':'sev-4','Average':'sev-3',
  'Warning':'sev-2','Info':'sev-1','Not classified':'sev-0',
};

document.getElementById('page-title').textContent =
  (_site === 'michoacan' ? 'K1 Michoacan' : 'K1 Tamaulipas') + ' — Daily Alert Analysis';

async function runAnalysis() {
  const btn  = document.getElementById('run-btn');
  const root = document.getElementById('root');
  btn.disabled = true;
  btn.textContent = 'Fetching...';
  root.innerHTML = '<p class="loading-msg">Fetching 24h Zabbix data and generating AI report…<br><small style="color:#475569">This may take 20–40 seconds (includes Claude AI call)</small></p>';
  document.getElementById('gen-ts').textContent = '';

  try {
    const resp = await fetch(`/daily-api/${_site}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    if (!resp.ok) throw new Error(`Server error ${resp.status}`);
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    render(data);
  } catch(e) {
    root.innerHTML = `<div class="err-box">Error: ${e.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Refresh';
  }
}

function delta(today, yest) {
  if (yest === 0 && today === 0) return '<span class="trend trend-same">&#8212;</span>';
  const diff = today - yest;
  if (diff > 0) return `<span class="trend trend-up">&#8593; +${diff}</span>`;
  if (diff < 0) return `<span class="trend trend-down">&#8595; ${diff}</span>`;
  return '<span class="trend trend-same">&#8212;</span>';
}

function render(data) {
  const s  = data.summary;
  const ts = new Date(data.generated_at).toLocaleString();
  document.getElementById('gen-ts').textContent = `Generated: ${ts}`;
  document.getElementById('page-sub').textContent = data.label + ' — ' + data.generated_at.slice(0,10);

  // Severity rows
  const sevRows = SEV_ORDER.map(sev => {
    const t = s.by_severity_today[sev] || 0;
    const y = s.by_severity_yest[sev]  || 0;
    if (t === 0 && y === 0) return '';
    return `<tr>
      <td><span class="sev-badge ${SEV_CLASS[sev]}">${sev}</span></td>
      <td style="font-weight:600">${t}</td>
      <td>${y}</td>
      <td>${delta(t, y)}</td>
    </tr>`;
  }).join('');

  // Site rows
  const allSites = new Set([...Object.keys(s.by_site_today), ...Object.keys(s.by_site_yest)]);
  const siteRows = [...allSites].sort().map(site => {
    const t = s.by_site_today[site] || 0;
    const y = s.by_site_yest[site]  || 0;
    return `<tr>
      <td style="font-weight:600">${site}</td>
      <td>${t}</td>
      <td>${y}</td>
      <td>${delta(t, y)}</td>
    </tr>`;
  }).join('');

  // Top issues
  const issueItems = s.top10.map((it, i) =>
    `<li>
      <span class="issue-rank">${i+1}</span>
      <span class="issue-name">${it.name}</span>
      <span class="issue-count">x${it.count}</span>
    </li>`
  ).join('');

  // AI report
  const aiHtml = data.ai_report
    ? `<div class="ai-report">${data.ai_report.replace(/</g,'&lt;')}</div>`
    : `<div class="ai-placeholder">AI analysis not available.<br>
       Set the <code>ANTHROPIC_API_KEY</code> environment variable before starting the proxy:<br><br>
       <code>set ANTHROPIC_API_KEY=sk-ant-...</code><br>
       <code>python zbx_hub_proxy.py</code></div>`;

  const diffTotal = s.today_total - s.yest_total;
  const diffClass = diffTotal > 0 ? 'delta-up' : diffTotal < 0 ? 'delta-down' : 'delta-same';
  const diffSign  = diffTotal > 0 ? '+' : '';

  document.getElementById('root').innerHTML = `
    <div class="kpi-row">
      <div class="kpi">
        <div class="kpi-label">Problems Today (24h)</div>
        <div class="kpi-value">${s.today_total}</div>
        <div class="kpi-delta ${diffClass}">vs yesterday: ${diffSign}${diffTotal}</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Problems Yesterday</div>
        <div class="kpi-value" style="color:var(--t2)">${s.yest_total}</div>
        <div class="kpi-delta">previous 24h window</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Unacknowledged</div>
        <div class="kpi-value" style="color:${s.unacked > 0 ? 'var(--red)' : 'var(--grn)'}">${s.unacked}</div>
        <div class="kpi-delta">of today's problems</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Unique Issue Types</div>
        <div class="kpi-value">${s.top10.length}</div>
        <div class="kpi-delta">top ${s.top10.length} shown below</div>
      </div>
    </div>

    <div class="main">
      <div class="panel">
        <div class="panel-title">Alerts by Severity</div>
        <table>
          <thead><tr><th>Severity</th><th>Today</th><th>Yesterday</th><th>Trend</th></tr></thead>
          <tbody>${sevRows || '<tr><td colspan="4" style="color:var(--t3);text-align:center;padding:20px">No problems in last 48h</td></tr>'}</tbody>
        </table>
      </div>

      <div class="panel">
        <div class="panel-title">Alerts by Site</div>
        <table>
          <thead><tr><th>Site</th><th>Today</th><th>Yesterday</th><th>Trend</th></tr></thead>
          <tbody>${siteRows || '<tr><td colspan="4" style="color:var(--t3);text-align:center;padding:20px">No data</td></tr>'}</tbody>
        </table>
      </div>

      <div class="panel full">
        <div class="panel-title">Top Recurring Issues (Today)</div>
        <ul class="issue-list">${issueItems || '<li><span style="color:var(--t3)">No recurring issues found</span></li>'}</ul>
      </div>

      <div class="panel full ai-panel">
        <div class="ai-title">
          <div class="panel-title" style="margin:0">AI Operational Report</div>
          <span class="ai-badge">Claude AI</span>
        </div>
        ${aiHtml}
      </div>
    </div>`;
}
</script>
</body>
</html>
