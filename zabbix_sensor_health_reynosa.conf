# Sensor Health — Reynosa Sites
# Drop into: C:\Program Files\Zabbix Agent\zabbix_agentd.d\
# Also add/update in zabbix_agentd.conf:  Timeout=30
# Restart Zabbix agent service after changes.
#
# Returns compact JSON for one site — used as Zabbix master item (Text).
# Dependent items extract individual values via JSONPath preprocessing.

UserParameter=sensor.health.data[*],"C:\Program Files\Python312\python.exe" "C:\Program Files\Zabbix Agent\scripts\sensor_health_reynosa.py" --site $1 --zabbix-json
